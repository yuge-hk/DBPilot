name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build
      - name: Build binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -trimpath \
            -ldflags "-s -w -X github.com/dbpilot/dbpilot/internal/version.Version=$VERSION" \
            -o dist/dbpilot_${GOOS}_${GOARCH} ./cmd/dbpilot
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dbpilot_${{ matrix.goos }}_${{ matrix.goarch }}
          path: dist/dbpilot_${{ matrix.goos }}_${{ matrix.goarch }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum dbpilot_linux_amd64 dbpilot_linux_arm64 > SHA256SUMS
          cat SHA256SUMS
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/dbpilot_linux_amd64
            dist/dbpilot_linux_arm64
            dist/SHA256SUMS
